<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Identity & Recipe Vault</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center justify-start p-6">

  <!-- Header Navigation -->
  <header class="w-full max-w-4xl flex justify-between items-center pb-6 mb-6 border-b border-gray-800">
    <h1 class="text-2xl font-bold tracking-wide text-amber-400">Identity & Recipe Vault</h1>
    
    <div id="nav-user-area" class="hidden flex items-center space-x-4">
      <span class="text-sm text-gray-300">Signed in as: <strong id="user-display" class="text-white"></strong></span>
      <button id="btn-signout" class="px-3 py-1.5 bg-red-600 hover:bg-red-500 text-xs font-semibold rounded-lg transition">Sign Out</button>
    </div>
  </header>

  <main class="w-full max-w-4xl space-y-8">
    
    <!-- Auth Section (Shown when user is signed out) -->
    <section id="auth-section" class="bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-xl max-w-md mx-auto">
      <h2 class="text-xl font-semibold mb-2 text-center">Sign In to Access Vault</h2>
      <p class="text-sm text-gray-400 text-center mb-6">Log in to view and publish community recipes</p>

      <!-- GitHub Auth Button -->
      <button id="btn-github-auth" class="w-full bg-gray-700 hover:bg-gray-600 font-medium py-2.5 rounded-lg mb-4 flex items-center justify-center space-x-2 transition">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        <span>Sign in with GitHub</span>
      </button>

      <div class="relative my-4">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-700"></div></div>
        <div class="relative flex justify-center text-xs uppercase"><span class="bg-gray-800 px-2 text-gray-400">Or with email</span></div>
      </div>

      <!-- Email Auth Inputs -->
      <div class="space-y-3">
        <input id="auth-email" type="email" placeholder="Email address" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-400" />
        <input id="auth-password" type="password" placeholder="Password" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-400" />
        
        <div class="flex space-x-2 pt-2">
          <button id="btn-email-signin" class="w-1/2 bg-amber-500 hover:bg-amber-400 text-gray-900 font-semibold py-2 rounded-lg text-sm transition">Sign In</button>
          <button id="btn-email-signup" class="w-1/2 bg-gray-700 hover:bg-gray-600 font-semibold py-2 rounded-lg text-sm transition">Sign Up</button>
        </div>
      </div>
    </section>

    <!-- Vault Main Content Area (ONLY VISIBLE WHEN SIGNED IN) -->
    <div id="vault-content" class="hidden space-y-8">
      
      <!-- Add Recipe Form -->
      <section class="bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-xl">
        <h2 class="text-xl font-bold text-amber-400 mb-4">Add a New Recipe</h2>
        <form id="recipe-form" class="space-y-4">
          <div>
            <label class="block text-sm text-gray-300 mb-1">Recipe Title</label>
            <input id="recipe-title" type="text" required placeholder="e.g. Creamy Alfredo Pasta" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-400" />
          </div>
          <div>
            <label class="block text-sm text-gray-300 mb-1">Food Image</label>
            <input id="recipe-file" type="file" accept="image/*" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-400 focus:outline-none focus:border-amber-400 file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-gray-900 hover:file:bg-amber-400" />
          </div>
          <div>
            <label class="block text-sm text-gray-300 mb-1">Ingredients</label>
            <textarea id="recipe-ingredients" rows="2" placeholder="e.g. Pasta, Heavy Cream, Garlic, Parmesan" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-400"></textarea>
          </div>
          <div>
            <label class="block text-sm text-gray-300 mb-1">Instructions / Description</label>
            <textarea id="recipe-instructions" rows="3" required placeholder="e.g. Boil pasta, cook garlic in butter, add cream..." class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-400"></textarea>
          </div>
          <button id="btn-submit-recipe" type="submit" class="bg-amber-500 hover:bg-amber-400 text-gray-900 font-bold px-5 py-2.5 rounded-lg text-sm transition">
            Publish Recipe
          </button>
        </form>
      </section>

      <!-- Member Recipe Feed Section -->
      <section class="bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-xl">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-bold text-amber-400">Vault Recipes</h2>
          <span class="text-xs text-gray-400">Click any card to view details</span>
        </div>

        <div id="recipes-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <p class="text-gray-400 text-sm col-span-full">Loading recipes...</p>
        </div>
      </section>

    </div>

  </main>

  <!-- Recipe Detail View Modal -->
  <div id="recipe-modal" class="hidden fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50">
    <div class="bg-gray-800 border border-gray-700 rounded-xl p-6 max-w-lg w-full space-y-4 shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <button id="modal-close" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl font-bold">&times;</button>
      
      <div id="modal-image-container" class="hidden w-full h-48 rounded-lg overflow-hidden bg-gray-900">
        <img id="modal-image" class="w-full h-full object-cover" src="" alt="Recipe image" />
      </div>

      <h3 id="modal-title" class="text-2xl font-bold text-amber-400 pr-6"></h3>
      
      <div id="modal-ingredients-container">
        <h4 class="text-sm font-semibold text-gray-300 mb-1">Ingredients:</h4>
        <p id="modal-ingredients" class="text-sm text-gray-200 bg-gray-900 p-3 rounded-lg whitespace-pre-wrap"></p>
      </div>

      <div>
        <h4 class="text-sm font-semibold text-gray-300 mb-1">Instructions:</h4>
        <p id="modal-instructions" class="text-sm text-gray-200 bg-gray-900 p-3 rounded-lg whitespace-pre-wrap"></p>
      </div>
    </div>
  </div>

  <!-- JS Scripts -->
  <script src="config.js?v=1.4"></script>
  <script src="app.js?v=1.4"></script>
</body>
</html>
