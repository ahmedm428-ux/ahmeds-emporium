<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recipe Vault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">

  <!-- Navigation Bar -->
  <nav class="border-b border-gray-800 bg-gray-900/50 backdrop-blur px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-amber-500">🍳 Recipe Vault</h1>
    <div id="nav-user-area" class="hidden flex items-center space-x-4">
      <span id="user-display" class="text-sm font-medium text-gray-300"></span>
      <button id="btn-signout" type="button" class="bg-gray-800 hover:bg-gray-700 text-xs px-3 py-1.5 rounded transition">Sign Out</button>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto p-6 space-y-8">

    <!-- Auth Section -->
    <section id="auth-section" class="max-w-md mx-auto bg-gray-900 p-6 rounded-xl border border-gray-800 space-y-4">
      <h2 class="text-lg font-bold text-center">Sign In to Access Vault</h2>
      
      <button id="btn-github-auth" type="button" class="w-full bg-gray-800 hover:bg-gray-700 py-2 rounded font-medium text-sm transition flex items-center justify-center space-x-2">
        <span>Sign in with GitHub</span>
      </button>

      <div class="relative flex py-2 items-center">
        <div class="flex-grow border-t border-gray-800"></div>
        <span class="flex-shrink mx-4 text-xs text-gray-500">or use email</span>
        <div class="flex-grow border-t border-gray-800"></div>
      </div>

      <div class="space-y-3">
        <input id="auth-email" type="email" placeholder="Email" class="w-full bg-gray-950 border border-gray-800 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-500" />
        <input id="auth-password" type="password" placeholder="Password" class="w-full bg-gray-950 border border-gray-800 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-500" />
        
        <div class="flex space-x-2 pt-2">
          <button id="btn-email-signin" type="button" class="w-1/2 bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold py-2 rounded text-sm transition">Sign In</button>
          <button id="btn-email-signup" type="button" class="w-1/2 bg-gray-800 hover:bg-gray-700 font-medium py-2 rounded text-sm transition">Sign Up</button>
        </div>
      </div>
    </section>

    <!-- Username Setup Section -->
    <section id="username-setup-section" class="hidden max-w-md mx-auto bg-gray-900 p-6 rounded-xl border border-gray-800 space-y-4">
      <h2 class="text-lg font-bold text-center">Set Your Username</h2>
      <p class="text-xs text-gray-400 text-center">Choose a display name for your recipe vault profile.</p>
      <input id="username-input" type="text" placeholder="Username" class="w-full bg-gray-950 border border-gray-800 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-500" />
      <button id="btn-save-username" type="button" class="w-full bg-amber-500 text-gray-950 font-bold py-2 rounded text-sm hover:bg-amber-600 transition">Save Profile</button>
    </section>

    <!-- Vault Main Content -->
    <div id="vault-content" class="hidden space-y-8">

      <!-- Staff Dashboard Section -->
      <section id="admin-panel" class="hidden bg-amber-500/10 border border-amber-500/30 rounded-xl p-4 space-y-4">
        <h3 class="text-md font-bold text-amber-500">🛡️ Staff Dashboard</h3>
        
        <!-- Admin Only Controls -->
        <div id="admin-only-controls" class="hidden space-y-2 pt-2 border-t border-amber-500/20">
          <p class="text-xs font-semibold text-gray-300">Promote Moderator (Admin Only):</p>
          <div class="flex space-x-2">
            <input id="mod-user-id" type="text" placeholder="Target User ID (UUID)" class="bg-gray-900 border border-gray-700 rounded px-2 py-1 text-xs w-2/3 focus:outline-none focus:border-amber-500" />
            <button id="btn-add-mod" type="button" class="bg-amber-500 hover:bg-amber-600 text-gray-900 font-bold px-3 py-1 text-xs rounded transition">Add Mod</button>
          </div>
        </div>
      </section>

      <!-- Add Recipe Form -->
      <section class="bg-gray-900 p-6 rounded-xl border border-gray-800 space-y-4">
        <h2 class="text-lg font-bold text-amber-500">Add New Recipe</h2>
        <form id="recipe-form" class="space-y-3">
          <input id="recipe-title" type="text" placeholder="Recipe Title" required class="w-full bg-gray-950 border border-gray-800 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-500" />
          <textarea id="recipe-ingredients" placeholder="Ingredients (one per line)" required rows="3" class="w-full bg-gray-950 border border-gray-800 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-500"></textarea>
          <textarea id="recipe-instructions" placeholder="Instructions" required rows="3" class="w-full bg-gray-950 border border-gray-800 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-500"></textarea>
          
          <!-- File Attachment Input -->
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">Attachment (Image or PDF):</label>
            <input id="recipe-file" type="file" accept="image/*,application/pdf" class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-gray-800 file:text-amber-500 hover:file:bg-gray-700" />
          </div>

          <button type="submit" class="bg-amber-500 text-gray-950 font-bold px-4 py-2 rounded text-sm hover:bg-amber-600 transition">Save Recipe</button>
        </form>
      </section>

      <!-- Recipe Feed -->
      <section class="space-y-4">
        <h2 class="text-lg font-bold">Community Recipes</h2>
        <div id="recipe-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </section>

    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
